# Server configuration for docker/compose.yml (SPEC 6.1). Mounted read-only at /etc/scion.
# $NAME values come from the container environment; restart scion-server after editing.

[server]
listen = "0.0.0.0:7443"
tls_cert = "/var/lib/scion/secrets/tls.crt"
tls_key = "/var/lib/scion/secrets/tls.key"
repo = "monorepo"

[metadata]
url = "$SCION_DB_URL"

[objects]
endpoint = "http://minio:9000"
bucket = "scion"

[auth]
# Leave SCION_GITHUB_CLIENT_ID empty to disable GitHub login; service principals still work.
github_client_id = "$SCION_GITHUB_CLIENT_ID"
signing_keys = ["/var/lib/scion/secrets/signing.ed25519.pem"]

# To add a principal, hash its secret (`printf %s "$secret" | sha256sum`), add a block with that
# value, and grant it access in acl.toml.
[[auth.service_principals]]
name = "agent"
secret_sha256 = "$SCION_AGENT_SECRET_SHA256"

[[auth.service_principals]]
name = "admin"
secret_sha256 = "$SCION_ADMIN_SECRET_SHA256"

[policy]
path = "/etc/scion/acl.toml"
reload = true
