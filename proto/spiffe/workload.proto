// The part of the SPIFFE Workload API that Scion uses, copied from
// https://github.com/spiffe/spiffe/blob/main/standards/workloadapi.proto. The service and message
// names and the field numbers are that standard's and must not change.
syntax = "proto3";

service SpiffeWorkloadAPI {
  rpc FetchJWTSVID(JWTSVIDRequest) returns (JWTSVIDResponse);
}

message JWTSVIDRequest {
  repeated string audience = 1;
  string spiffe_id = 2;
}

message JWTSVIDResponse {
  repeated JWTSVID svids = 1;
}

message JWTSVID {
  string spiffe_id = 1;
  string svid = 2;
  string hint = 3;
}
